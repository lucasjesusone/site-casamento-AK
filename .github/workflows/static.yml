name: Deploy Angular to GitHub Pages 1

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Configure backend API URL
        working-directory: ./frontend
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          printf 'window.__SITE_CONFIG__ = { apiBaseUrl: "%s" };\n' "$API_BASE_URL" > src/assets/runtime-config.js

      - name: Build Angular
        working-directory: ./frontend
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: npm run build -- --base-href=/site-casamento-AK/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist/frontend/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4